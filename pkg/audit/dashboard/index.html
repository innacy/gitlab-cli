<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-agent — Activity Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green-0: #161b22; --green-1: #0e4429; --green-2: #006d32;
    --green-3: #26a641; --green-4: #39d353;
    --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; padding: 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  h2 { font-size: 18px; margin-bottom: 12px; color: var(--muted); }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card-full { grid-column: 1 / -1; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { text-align: center; }
  .stat-value { font-size: 32px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .heatmap { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-start; }
  .heatmap-week { display: flex; flex-direction: column; gap: 3px; }
  .heatmap-cell {
    width: 12px; height: 12px; border-radius: 2px; background: var(--green-0);
    position: relative; cursor: pointer;
  }
  .heatmap-cell:hover::after {
    content: attr(data-tooltip); position: absolute; bottom: 18px; left: 50%;
    transform: translateX(-50%); background: #1f2937; color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10;
  }
  .heatmap-cell.l1 { background: var(--green-1); }
  .heatmap-cell.l2 { background: var(--green-2); }
  .heatmap-cell.l3 { background: var(--green-3); }
  .heatmap-cell.l4 { background: var(--green-4); }
  .chart-container { position: relative; height: 250px; }
  .quality-bar { display: flex; height: 32px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .quality-bar div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .q-accepted { background: var(--green-3); }
  .q-edited { background: #d29922; }
  .q-discarded { background: #f85149; }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .legend .la::before { background: var(--green-3); }
  .legend .le::before { background: #d29922; }
  .legend .ld::before { background: #f85149; }
  #range-select { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .badge-fast { background: var(--green-2); color: var(--green-4); }
  .date-group { color: var(--accent); font-weight: 600; padding-top: 8px; }
</style>
</head>
<body>
<h1>git-agent</h1>
<p class="subtitle">Activity Dashboard</p>
<select id="range-select">
  <option value="month">Last 30 days</option>
  <option value="week">Last 7 days</option>
</select>
<div class="grid">
  <div class="card card-full">
    <h2>Activity Heatmap</h2>
    <div id="heatmap" class="heatmap"></div>
  </div>
  <div class="card card-full">
    <h2>Summary</h2>
    <div id="stats" class="stat-grid"></div>
  </div>
  <div class="card">
    <h2>Model Usage</h2>
    <div class="chart-container"><canvas id="modelChart"></canvas></div>
  </div>
  <div class="card">
    <h2>AI Output Quality</h2>
    <div id="quality"></div>
  </div>
  <div class="card card-full">
    <h2>Model Performance</h2>
    <div id="model-perf"></div>
  </div>
  <div class="card card-full">
    <h2>Model Usage by Date</h2>
    <div id="model-by-date"></div>
  </div>
</div>
<script>
const API = '';
let modelChart = null;

async function fetchJSON(url) {
  const r = await fetch(url);
  return r.json();
}

function utcToday() {
  const n = new Date();
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function utcKey(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

async function loadHeatmap() {
  const today = utcToday();
  const year = today.getUTCFullYear();
  const data = await fetchJSON(API + '/api/heatmap?year=' + year);
  const map = {};
  (data || []).forEach(d => map[d.Date] = d.Count);
  const el = document.getElementById('heatmap');
  el.innerHTML = '';
  const start = new Date(Date.UTC(year, 0, 1));
  const startDay = start.getUTCDay();
  let week = document.createElement('div');
  week.className = 'heatmap-week';
  for (let i = 0; i < startDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    cell.style.visibility = 'hidden';
    week.appendChild(cell);
  }
  const d = new Date(start);
  while (d <= today) {
    if (d.getUTCDay() === 0 && week.children.length > 0) {
      el.appendChild(week);
      week = document.createElement('div');
      week.className = 'heatmap-week';
    }
    const key = utcKey(d);
    const count = map[key] || 0;
    const cell = document.createElement('div');
    const level = count === 0 ? '' : count <= 2 ? 'l1' : count <= 5 ? 'l2' : count <= 10 ? 'l3' : 'l4';
    cell.className = 'heatmap-cell ' + level;
    cell.setAttribute('data-tooltip', key + ': ' + count + ' actions');
    week.appendChild(cell);
    d.setUTCDate(d.getUTCDate() + 1);
  }
  if (week.children.length > 0) el.appendChild(week);
}

async function loadStats(range) {
  const data = await fetchJSON(API + '/api/summary?range=' + range);
  const el = document.getElementById('stats');
  const stats = [
    ['Commands', data.total_events],
    ['AI Calls', data.ai_generations],
    ['MRs Created', data.mrs_created],
    ['MRs Reviewed', data.mrs_reviewed],
    ['Tickets', data.tickets_created],
    ['Files', data.files_written],
  ];
  el.innerHTML = stats.map(function(s) {
    return '<div class="stat"><div class="stat-value">' + s[1] + '</div><div class="stat-label">' + s[0] + '</div></div>';
  }).join('');
}

async function loadModels(range) {
  const data = await fetchJSON(API + '/api/models?range=' + range);
  const ctx = document.getElementById('modelChart').getContext('2d');
  if (modelChart) modelChart.destroy();
  if (!data || data.length === 0) return;
  modelChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: data.map(function(d) { return d.Model; }),
      datasets: [{ data: data.map(function(d) { return d.Count; }), backgroundColor: ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff'] }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#e6edf3' } } } }
  });
}

async function loadQuality(range) {
  const data = await fetchJSON(API + '/api/accuracy?range=' + range);
  const total = data.accepted + data.edited + data.discarded;
  const el = document.getElementById('quality');
  if (total === 0) { el.innerHTML = '<p style="color:var(--muted)">No AI outputs recorded yet.</p>'; return; }
  const pA = Math.round(data.accepted / total * 100);
  const pE = Math.round(data.edited / total * 100);
  const pD = 100 - pA - pE;
  let html = '<div class="quality-bar">';
  if (pA > 0) html += '<div class="q-accepted" style="width:' + pA + '%">' + pA + '%</div>';
  if (pE > 0) html += '<div class="q-edited" style="width:' + pE + '%">' + pE + '%</div>';
  if (pD > 0) html += '<div class="q-discarded" style="width:' + pD + '%">' + pD + '%</div>';
  html += '</div>';
  html += '<div class="legend">';
  html += '<span class="la">Accepted (' + data.accepted + ')</span>';
  html += '<span class="le">Edited (' + data.edited + ')</span>';
  html += '<span class="ld">Discarded (' + data.discarded + ')</span>';
  html += '</div>';
  if (data.avg_edit_ratio > 0) html += '<p style="color:var(--muted);margin-top:8px;font-size:13px">Avg edit ratio: ' + Math.round(data.avg_edit_ratio * 100) + '%</p>';
  el.innerHTML = html;
}

async function loadModelPerf(range) {
  const data = await fetchJSON(API + '/api/model-performance?range=' + range);
  const el = document.getElementById('model-perf');
  if (!data || data.length === 0) { el.innerHTML = '<p style="color:var(--muted)">No AI timing data recorded yet.</p>'; return; }
  let html = '<table><tr><th>Model</th><th>Calls</th><th>Avg</th><th>Min</th><th>Max</th><th></th></tr>';
  data.forEach(function(m, i) {
    const badge = i === 0 ? ' <span class="badge badge-fast">Fastest</span>' : '';
    html += '<tr><td>' + m.Model + badge + '</td><td>' + m.Count + '</td>'
      + '<td>' + (m.AvgMs / 1000).toFixed(1) + 's</td>'
      + '<td>' + (m.MinMs / 1000).toFixed(1) + 's</td>'
      + '<td>' + (m.MaxMs / 1000).toFixed(1) + 's</td>'
      + '<td></td></tr>';
  });
  html += '</table>';
  el.innerHTML = html;
}

async function loadModelByDate(range) {
  const data = await fetchJSON(API + '/api/model-stats?range=' + range);
  const el = document.getElementById('model-by-date');
  if (!data || data.length === 0) { el.innerHTML = '<p style="color:var(--muted)">No model usage data yet.</p>'; return; }
  let html = '<table><tr><th>Date</th><th>Model</th><th>Calls</th></tr>';
  let lastDate = '';
  data.forEach(function(m) {
    const dateCell = m.Date !== lastDate ? m.Date : '';
    const cls = m.Date !== lastDate ? ' class="date-group"' : '';
    html += '<tr><td' + cls + '>' + dateCell + '</td><td>' + m.Model + '</td><td>' + m.Count + '</td></tr>';
    lastDate = m.Date;
  });
  html += '</table>';
  el.innerHTML = html;
}

async function loadAll(range) {
  await Promise.all([loadHeatmap(), loadStats(range), loadModels(range), loadQuality(range), loadModelPerf(range), loadModelByDate(range)]);
}

document.getElementById('range-select').addEventListener('change', function(e) { loadAll(e.target.value); });
loadAll('month');
</script>
</body>
</html>
